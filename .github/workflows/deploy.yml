name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          NEXT_PUBLIC_DEFI_API_URL: https://defi-api-test.call-ava.com/mainnet
          NEXT_PUBLIC_DEFI_WALLETCONNECT_PROJECT_ID: b44c082ec5b67d0c199887e6944144b4
        run: npm run build

      - name: Add Ava Desktop release downloads
        id: downloads
        env:
          GH_TOKEN: ${{ secrets.DESKTOP_RELEASE_TOKEN || github.token }}
        run: node scripts/prepare-desktop-downloads.mjs

      - name: Upload versioned downloads without removing previous releases
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/downloads/
          server-dir: /public_html/downloads/
          state-name: .ftp-deploy-desktop-${{ steps.downloads.outputs.version }}.json
          dangerous-clean-slate: false
          timeout: 900000

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /public_html/
          dangerous-clean-slate: false
          timeout: 900000
          exclude: |
            **/.git*
            **/.git*/**
            **/downloads/**
            **/.ftp-deploy-update-feeds.json

      - name: Publish verified update feeds last
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./release-metadata/
          server-dir: /public_html/
          state-name: .ftp-deploy-update-feeds.json
          dangerous-clean-slate: false
          timeout: 900000

      - name: Verify public downloads and update feeds
        run: node scripts/verify-desktop-downloads.mjs

      - name: Save public download verification
        uses: actions/upload-artifact@v4
        with:
          name: desktop-download-verification
          path: release-verification.json
